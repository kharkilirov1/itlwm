name: Build AirportSequoia

on:
  push:
    branches: [sequoia-port]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Fetch MacKernelSDK
        run: git clone --depth=1 https://github.com/acidanthera/MacKernelSDK.git

      - name: Generate firmware blob
        run: |
          export PROJECT_DIR="$PWD"
          sh scripts/fw_gen.sh -P "$PWD/itlwm/firmware/"
          ls -la include/FwBinary.cpp

      - name: Generate Xcode project
        run: |
          xcodegen -s project_sequoia.yml
          # xcodegen не умеет product-type kernel-extension; bundle линкуется через clang++
          # и тянет -stdlib=libc++, чего в kext нет. Патчим тип продукта как у itlwm.
          sed -i '' 's/com\.apple\.product-type\.bundle/com.apple.product-type.kernel-extension/' AirportSequoia.xcodeproj/project.pbxproj

      - name: Build kext
        run: xcodebuild -project AirportSequoia.xcodeproj -scheme AirportSequoia -configuration Debug -derivedDataPath build

      - name: Upload kext
        uses: actions/upload-artifact@v4
        with:
          name: AirportSequoia.kext
          path: build/Build/Products/Debug/AirportSequoia.kext
