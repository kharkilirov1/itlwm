name: Build AirportSequoia

on:
  push:
    branches: [sequoia-port]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Fetch MacKernelSDK
        run: git clone --depth=1 https://github.com/acidanthera/MacKernelSDK.git

      - name: Generate firmware blob
        run: |
          export PROJECT_DIR="$PWD"
          sh scripts/fw_gen.sh -P "$PWD/itlwm/firmware/"
          ls -la include/FwBinary.cpp

      - name: Generate Xcode project
        run: |
          xcodegen -s project_sequoia.yml
          # xcodegen не умеет product-type kernel-extension; bundle линкуется через clang++
          # и тянет -stdlib=libc++, чего в kext нет. Патчим тип продукта как у itlwm.
          sed -i '' 's/com\.apple\.product-type\.bundle/com.apple.product-type.kernel-extension/' AirportSequoia.xcodeproj/project.pbxproj

      - name: Build kext and capture vtable layout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/sequoia-abi-witness
          xcodebuild \
            -project AirportSequoia.xcodeproj \
            -scheme AirportSequoia \
            -configuration Debug \
            -derivedDataPath build \
            OTHER_CPLUSPLUSFLAGS='$(inherited) -Xclang -fdump-vtable-layouts' \
            2>&1 | tee build/sequoia-abi-witness/xcodebuild-vtables.log

      - name: Verify Sequoia ABI skeleton
        run: |
          python3 scripts/verify_sequoia_abi.py vtables \
            --log build/sequoia-abi-witness/xcodebuild-vtables.log
          python3 scripts/verify_sequoia_abi.py binary \
            --kext build/Build/Products/Debug/AirportSequoia.kext

      - name: Upload ABI skeleton
        uses: actions/upload-artifact@v4
        with:
          name: AirportSequoia-ABI-skeleton-WCL-bridge-unverified
          path: |
            build/Build/Products/Debug/AirportSequoia.kext
            build/sequoia-abi-witness

      - name: Upload ABI gate witness on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: AirportSequoia-ABI-gate-failure-witness
          path: build/sequoia-abi-witness
          if-no-files-found: ignore
