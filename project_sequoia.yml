name: AirportSequoia
options:
  bundleIdPrefix: com.openintelwireless
targets:
  AirportSequoia:
    type: bundle
    platform: macOS
    deploymentTarget: "10.15"
    sources:
      - path: AirportSequoia
      - path: itlwm
        excludes:
          - "itlwm.cpp"
          - "pm.cpp"
          - "ItlNetworkUserClient.cpp"
          - "firmware/**"
          - "Info.plist"
      - path: itl80211
        excludes:
          - "Info.plist"
      - path: include/FwBinary.cpp
        optional: true
    settings:
      SDKROOT: macosx
      ARCHS: x86_64
      ONLY_ACTIVE_ARCH: NO
      PRODUCT_BUNDLE_IDENTIFIER: com.openintelwireless.AirportSequoia
      WRAPPER_EXTENSION: kext
      GENERATE_INFOPLIST_FILE: NO
      INFOPLIST_FILE: AirportSequoia/Info.plist
      CODE_SIGNING_ALLOWED: NO
      MODULE_NAME: com.openintelwireless.AirportSequoia
      KERNEL_EXTENSION_HEADER_SEARCH_PATHS: "$(SRCROOT)/MacKernelSDK/Headers"
      KERNEL_FRAMEWORK_HEADERS: "$(SRCROOT)/MacKernelSDK/Headers"
      HEADER_SEARCH_PATHS:
        - "$(SRCROOT)/include"
        - "$(SRCROOT)/MacKernelSDK/Headers"
      SYSTEM_HEADER_SEARCH_PATHS: "itl80211/openbsd itl80211 include"
      LIBRARY_SEARCH_PATHS:
        - "$(SRCROOT)/MacKernelSDK/Library/x86_64"
      OTHER_LDFLAGS:
        - "-Xlinker"
        - "-kext"
        - "-lkmodc++"
        - "-lkmod"
      GCC_ENABLE_CPP_EXCEPTIONS: NO
      GCC_ENABLE_CPP_RTTI: NO
      GCC_PREPROCESSOR_DEFINITIONS: "KERNEL=1 AIRPORT __PRIVATE_SPI__ IO80211FAMILY_V2 __IO80211_TARGET=__MAC_13_0 $(inherited)"
      OTHER_CFLAGS: "-mkernel"
      OTHER_CPLUSPLUSFLAGS: "-mkernel -Wno-deprecated-register"
      CLANG_CXX_LANGUAGE_STANDARD: gnu++14
      GCC_C_LANGUAGE_STANDARD: gnu11
      GCC_INPUT_FILETYPE: sourcecode.cpp.cpp
      MACH_O_TYPE: mh_object
      KERNEL_EXTENSION: YES
